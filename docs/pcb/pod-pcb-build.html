<title>Pod PCB Build</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: sticky step bar; to-scale board drawing (left, sticky) beside one step card (right); stacks on phones */
:root {
  --bg: #eef1ee; --surface: #ffffff; --ink: #17201c; --muted: #5b6862; --line: #d2dad5;
  --accent: #a65a00; --accent-fill: #ffb627; --accent-tint: #fff4dc;
  --ok: #1d7f45; --ok-tint: #e3f4e8; --bad: #c22b2b; --bad-tint: #fbe6e4;
  --probe-red: #e0283a; --probe-black: #111111;
  /* the board is a physical object: same in both themes */
  --mask: #1f5c3c; --mask-edge: #164a2f; --silk: #f1f1e8; --pad: #c7ccd1; --hole: #0d1a12;
  --f-display: 'Barlow Condensed', 'Arial Narrow', sans-serif;
  --f-body: 'IBM Plex Sans', -apple-system, 'Segoe UI', sans-serif;
  --f-mono: 'IBM Plex Mono', 'SF Mono', Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111613; --surface: #1a211d; --ink: #e5ebe7; --muted: #93a39a; --line: #2d3832;
  --accent: #ffbe55; --accent-fill: #ffb627; --accent-tint: #2f2614;
  --ok: #52c47e; --ok-tint: #15291d; --bad: #ff7a6e; --bad-tint: #321a18;
  --probe-red: #ff4455; --probe-black: #111111; color-scheme: dark;
}}
:root[data-theme="dark"] {
  --bg: #111613; --surface: #1a211d; --ink: #e5ebe7; --muted: #93a39a; --line: #2d3832;
  --accent: #ffbe55; --accent-fill: #ffb627; --accent-tint: #2f2614;
  --ok: #52c47e; --ok-tint: #15291d; --bad: #ff7a6e; --bad-tint: #321a18;
  --probe-red: #ff4455; --probe-black: #111111; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5;
  padding-inline: 16px; max-width: 1180px; margin: 0 auto; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* top bar */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg);
  padding-block: 12px 10px; border-bottom: 1px solid var(--line); display: grid; gap: 8px; }
.bar-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
.name { font-family: var(--f-display); font-weight: 700; font-size: 1.35rem; letter-spacing: .01em; margin: 0; margin-right: auto; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 5px 12px; cursor: pointer; font-size: .85rem; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); font-weight: 600; }
.count { font-family: var(--f-mono); font-size: .85rem; font-variant-numeric: tabular-nums; color: var(--muted); }
.count b { color: var(--ink); }
.awake { display: inline-flex; align-items: center; gap: 6px; font-size: .8rem; color: var(--muted); cursor: pointer; }
.stages { display: flex; gap: 3px; }
.stages button { flex: var(--n) 1 0; min-width: 0; height: 22px; border: 0; padding: 0; cursor: pointer; background: none;
  display: flex; flex-direction: column; gap: 3px; text-align: left; }
.stages i { display: block; height: 5px; width: 100%; border-radius: 2px; background: var(--line); overflow: hidden; }
.stages i b { display: block; height: 100%; background: var(--ok); }
.stages span { font-size: .62rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stages button.cur span { color: var(--ink); font-weight: 600; }
.stages button.cur i { outline: 1.5px solid var(--accent-fill); outline-offset: 1px; }
@media (max-width: 640px) { .stages span { display: none; } .stages button { height: 8px; } }

/* power badge */
.power { display: flex; align-items: center; gap: 10px; padding: 7px 12px; border-radius: 6px; font-size: .88rem; font-weight: 500; }
.power .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.power.out { background: var(--ok-tint); color: var(--ok); } .power.out .dot { background: var(--ok); }
.power.on { background: var(--bad-tint); color: var(--bad); } .power.on .dot { background: var(--bad); animation: blink 1.2s infinite; }
.power.usb, .power.brief { background: var(--accent-tint); color: var(--accent); } .power.usb .dot, .power.brief .dot { background: var(--accent-fill); }
@keyframes blink { 50% { opacity: .25; } }

/* main grid */
.grid { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 24px; padding-block: 18px 40px; align-items: start; }
.boardpanel { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 128px); display: grid; gap: 10px; min-width: 0; }
@media (max-width: 860px) { .grid { grid-template-columns: minmax(0, 1fr); } .boardpanel { position: static; } }
.boardwrap { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px; }
#board, #boardBack { display: block; width: 100%; height: auto; }
.vlabel { font-size: .8rem; color: var(--muted); margin: 0 0 6px; }
.vlabel b { color: var(--ink); letter-spacing: .06em; }
.vlabel.back b { color: var(--ok); }
.vnote { font-size: .78rem; color: var(--muted); margin-top: 6px; }
.caption { font-size: .85rem; display: grid; gap: 4px; min-height: 2.6em; }
.caption .pr { display: flex; gap: 8px; align-items: baseline; }
.tag { font-family: var(--f-mono); font-size: .7rem; font-weight: 600; padding: 1px 6px; border-radius: 3px; flex: none; }
.tag.red { background: var(--probe-red); color: #fff; }
.tag.blk { background: var(--probe-black); color: #fff; box-shadow: inset 0 0 0 1px #888; }
.tag.look { background: var(--accent-fill); color: #000; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: .75rem; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { width: 14px; height: 9px; border-radius: 2px; display: inline-block; }

/* step card */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px 20px 20px; min-width: 0; display: grid; gap: 14px; }
.eyebrow { font-size: .7rem; text-transform: uppercase; letter-spacing: .09em; font-weight: 600; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; }
.eyebrow .done-flag { color: var(--ok); }
h2 { font-family: var(--f-display); font-weight: 700; font-size: 2rem; line-height: 1.05; margin: 2px 0 0; text-wrap: balance; letter-spacing: .005em; }
h2 .val { color: var(--accent); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chip { font-size: .78rem; padding: 2px 8px; border-radius: 4px; border: 1px solid var(--line); background: var(--bg); }
.chip.now { border-color: var(--ok); color: var(--ok); font-weight: 600; }
.bands { display: inline-flex; align-items: center; gap: 0; height: 16px; padding: 0 5px; border-radius: 8px; background: #8fb7df; }
.bands i { width: 4px; height: 16px; margin: 0 2px; display: block; }
.bands i:last-child { margin-left: 6px; }
.orient { background: var(--accent-tint); border-left: 3px solid var(--accent-fill); padding: 9px 12px; border-radius: 0 6px 6px 0; font-size: .92rem; }
.orient b { color: var(--accent); }
.side { display: grid; grid-template-columns: 136px 1fr; gap: 12px; align-items: center; border: 2px solid var(--ok); border-radius: 8px; padding: 10px 12px; }
.side svg { width: 136px; height: auto; display: block; color: var(--muted); }
.side p { margin: 0; font-size: .92rem; }
.side p + p { margin-top: 4px; }
.side .lead { font-weight: 700; font-size: 1rem; }
@media (max-width: 380px) { .side { grid-template-columns: 1fr; } }
.legs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.legs figure { margin: 0; background: var(--bg); border-radius: 6px; padding: 6px; display: grid; gap: 4px; align-content: start; }
.legs svg { width: 100%; height: auto; display: block; color: var(--muted); }
.legs figcaption { font-size: .76rem; line-height: 1.3; }
.legs figcaption b { color: var(--ok); margin-right: 2px; }
.u1d { display: grid; gap: 10px; border: 1px solid var(--line); border-radius: 8px; padding: 10px; }
.u1d > svg { width: 100%; height: auto; display: block; color: var(--muted); }
.u1key { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px 12px; font-size: .86rem; }
.u1key li { display: flex; align-items: center; gap: 6px; }
.u1key i { width: 18px; height: 5px; border-radius: 3px; outline: 1px solid #9aa1a7; flex: none; }
details.trace { border: 1px solid var(--line); border-radius: 8px; padding: 10px; display: grid; gap: 10px; }
figure.trj2 svg { max-width: 220px; }
details.trace summary { cursor: pointer; font-weight: 600; }
.trflow { margin: 8px 0 0; font-size: .86rem; color: var(--muted); }
figure.tr { margin: 10px 0 0; display: grid; gap: 6px; padding-top: 10px; border-top: 1px solid var(--line); }
figure.tr svg { width: 100%; height: auto; display: block; border-radius: 4px; }
figure.tr figcaption { display: grid; gap: 3px; font-size: .82rem; }
figure.tr .pr { display: flex; gap: 6px; align-items: baseline; }
figure.tr .fixline { color: var(--muted); }
.u1steps { margin: 0; padding-left: 1.3em; display: grid; gap: 3px; font-size: .88rem; }
ul.do { margin: 0; padding-left: 1.1em; display: grid; gap: 4px; }
ul.do li::marker { color: var(--muted); }
.warn { background: var(--bad-tint); color: var(--bad); padding: 8px 12px; border-radius: 6px; font-size: .88rem; font-weight: 500; }
details.how { font-size: .88rem; border-top: 1px solid var(--line); padding-top: 10px; }
details.how summary { cursor: pointer; color: var(--muted); font-weight: 500; }
details.how ol { margin: 8px 0 0; padding-left: 1.3em; display: grid; gap: 3px; }
table.parts { width: 100%; border-collapse: collapse; font-size: .84rem; }
table.parts td { padding: 4px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.parts td:first-child { font-family: var(--f-mono); font-weight: 600; white-space: nowrap; }
.tblwrap { overflow-x: auto; }

/* meter checks */
.checks { display: grid; gap: 8px; }
.checks h3 { font-family: var(--f-display); font-size: 1.05rem; letter-spacing: .03em; text-transform: uppercase; margin: 0; display: flex; align-items: center; gap: 8px; }
.checks h3 small { font-family: var(--f-body); text-transform: none; letter-spacing: 0; font-weight: 400; color: var(--muted); font-size: .8rem; }
.check { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: grid; gap: 6px; cursor: pointer; background: var(--surface); }
.check.sel { border-color: var(--accent-fill); box-shadow: 0 0 0 1px var(--accent-fill); }
.check.ok { background: var(--ok-tint); border-color: transparent; }
.check.bad { background: var(--bad-tint); border-color: var(--bad); }
.chk-top { display: flex; gap: 10px; align-items: flex-start; }
.mode { font-family: var(--f-mono); font-size: .72rem; font-weight: 600; min-width: 46px; text-align: center; padding: 3px 4px; border-radius: 4px;
  background: var(--ink); color: var(--bg); flex: none; }
.probes { font-size: .86rem; display: grid; gap: 2px; min-width: 0; }
.probes .pr { display: flex; gap: 6px; align-items: baseline; }
.expect { font-size: .95rem; }
.expect strong { font-family: var(--f-mono); font-weight: 600; font-variant-numeric: tabular-nums; }
.why { font-size: .82rem; color: var(--muted); }
.fix { font-size: .85rem; color: var(--bad); font-weight: 500; }
.cbtns { display: flex; gap: 6px; flex-wrap: wrap; }
.cbtns button { border: 1px solid var(--line); background: var(--bg); border-radius: 5px; padding: 4px 10px; cursor: pointer; font-size: .82rem; }
.cbtns button.y[aria-pressed="true"] { background: var(--ok); color: #fff; border-color: var(--ok); }
.cbtns button.n[aria-pressed="true"] { background: var(--bad); color: #fff; border-color: var(--bad); }

/* nav */
.nav { display: flex; gap: 10px; align-items: center; border-top: 1px solid var(--line); padding-top: 14px; }
.nav .back { border: 1px solid var(--line); background: var(--bg); border-radius: 6px; padding: 10px 14px; cursor: pointer; }
.nav .next { flex: 1; border: 0; border-radius: 6px; padding: 11px 16px; cursor: pointer; font-weight: 600; font-size: 1rem;
  background: var(--ink); color: var(--bg); }
.nav .next:disabled { background: var(--line); color: var(--muted); cursor: not-allowed; }
.nav .back:disabled { opacity: .4; cursor: default; }
.gate { font-size: .8rem; color: var(--muted); text-align: right; }
.upnext { font-size: .82rem; color: var(--muted); }
.upnext b { color: var(--ink); font-weight: 500; }

/* step list */
details.list { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; }
details.list summary { cursor: pointer; font-weight: 600; font-size: .9rem; }
.slist { display: grid; gap: 12px; margin-top: 10px; }
.slist h4 { margin: 0 0 4px; font-size: .68rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.slist ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 1px; }
.slist button { width: 100%; text-align: left; border: 0; background: none; padding: 4px 6px; border-radius: 4px; cursor: pointer; font-size: .85rem;
  display: flex; gap: 8px; align-items: baseline; }
.slist button:hover { background: var(--bg); }
.slist button.cur { background: var(--accent-tint); font-weight: 600; }
.slist .n { font-family: var(--f-mono); font-size: .75rem; color: var(--muted); width: 2.2em; flex: none; font-variant-numeric: tabular-nums; }
.slist .tick { width: 1em; flex: none; color: var(--ok); }
.reset { margin-top: 12px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: .82rem; }
.reset button { border: 1px solid var(--line); background: var(--bg); border-radius: 5px; padding: 4px 10px; cursor: pointer; }
.reset button.danger { border-color: var(--bad); color: var(--bad); }

/* svg */
.halo { fill: none; stroke: var(--accent-fill); stroke-width: .7; animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 50% { stroke-opacity: .35; } }
.probe-ring { animation: pulse 1.1s ease-in-out infinite; }
@media (prefers-reduced-motion: reduce) { .halo, .probe-ring, .power.on .dot { animation: none; } }
</style>

<header class="bar">
  <div class="bar-row">
    <h1 class="name">Pod PCB Build</h1>
    <div class="seg" role="group" aria-label="Which board">
      <button type="button" id="arm1" data-arm="1">Arm 1</button>
      <button type="button" id="arm2" data-arm="2">Arm 2</button>
    </div>
    <span class="count" id="count"></span>
    <label class="awake"><input type="checkbox" id="awake"> Keep screen on</label>
  </div>
  <div class="stages" id="stages"></div>
  <div class="power" id="power"><span class="dot"></span><span id="powerText"></span></div>
</header>

<main class="grid">
  <section class="boardpanel" aria-label="Board">
    <div class="boardwrap"><div class="vlabel"><b>FRONT</b> · white outlines · part goes in here</div><svg id="board" viewBox="-1.5 -1.5 77 37" role="img" aria-label="Pod PCB, front, drawn to scale"></svg></div>
    <div class="boardwrap" id="backWrap" hidden><div class="vlabel back"><b>BACK</b> · “CLOWN POD rev A” · solder here</div><svg id="boardBack" viewBox="-1.5 -1.5 73 33" role="img" aria-label="Pod PCB, back, flipped left to right"></svg><div class="vnote">Turned over like a page: the XIAO end is now on the <b>right</b>. Pulsing rings = this step’s joints. Silver cones = joints already done.</div></div>
    <div class="caption" id="caption"></div>
    <div class="legend">
      <span><i style="background:var(--accent-fill)"></i>This step</span>
      <span><i style="background:#8fb7df"></i>Fitted</span>
      <span><i style="background:transparent;border:1px solid var(--muted)"></i>Not yet</span>
      <span><i style="background:var(--probe-red)"></i>Red probe</span>
      <span><i style="background:var(--probe-black);border:1px solid #888"></i>Black probe</span>
    </div>
  </section>

  <div style="display:grid;gap:16px;min-width:0">
    <article class="card" id="card" aria-live="polite"></article>
    <details class="list" id="listBox">
      <summary>All steps</summary>
      <div class="slist" id="slist"></div>
      <div class="reset" id="resetBox"></div>
    </details>
  </div>
</main>

<script>
/* ---------- board geometry (mm), from docs/pcb/pod_pcb.py ---------- */
const BAND = { black:'#111', brown:'#7b4a1e', red:'#d42a2a', orange:'#f08a17', yellow:'#f1d11b', green:'#24974a',
  blue:'#2c62d6', violet:'#8b3fc0', grey:'#8a8a8a', white:'#f4f4f4', gold:'#c8a23a' };
const B100K = ['brown','black','black','orange','brown'], B10K = ['brown','black','black','red','brown'],
      B100 = ['brown','black','black','black','brown'], B470 = ['yellow','violet','black','black','brown'];

const u2pin = n => n <= 7 ? [27 + 2.54*(n-1), 19.81] : [27 + 2.54*(14-n), 12.19];
const u3pin = n => n <= 7 ? [2.5 + 2.54*(n-1), 21.62] : [2.5 + 2.54*(14-n), 6.38];

const PARTS = {
  R1: { t:'res', a:[42.16,2.6], b:[32.0,2.6], bands:B100K },
  R2: { t:'res', a:[29.66,2.6], b:[19.5,2.6], bands:B100K },
  R6: { t:'res', a:[24.2,22.8], b:[31.82,22.8], bands:B100K },
  R4: { t:'res', a:[34.6,22.8], b:[42.22,22.8], bands:B100 },
  R5: { t:'res', a:[48.2,22.8], b:[55.82,22.8], bands:B10K },
  R3: { t:'res', a:[56.1,3.6], b:[56.1,13.76], bands:B470 },
  C2: { t:'disc', a:[27,8.4], b:[32,8.4] },
  C3: { t:'disc', a:[23.4,18.6], b:[23.4,13.6] },
  CR2:{ t:'diode', k:[6.5,2.6], a:[16.66,2.6] },
  F1: { t:'fuse', a:[34.04,26.8], b:[28.96,26.8], box:[24,24.65,39,28.95] },
  Q1: { t:'to220', box:[45.3,15.3,56.2,20.1] },
  U2: { t:'dip', box:[25.6,13.4,43.6,18.6] },
  C1: { t:'ecap', c:[49,9], r:5 },
  U3: { t:'xiao', box:[-0.4,5.1,20.6,22.9] },
  U1: { t:'wires', pads:[[17,26.8],[13.5,26.8],[10,26.8],[6.5,26.8]], dir:'down', colors:['#d42a2a','#222','#f1c21b','#222'] },
  SW1:{ t:'wires', pads:[[49.5,26.8],[46,26.8]], dir:'down', colors:['#d42a2a','#d42a2a'] },
  J1: { t:'wires', pads:[[58.5,26.8],[62,26.8]], dir:'down', colors:['#d42a2a','#222'] },
  J2: { t:'wires', pads:[[66.5,6.4],[66.5,9.2],[66.5,12]], dir:'right', colors:['#9aa0a6','#9aa0a6','#9aa0a6'] },
  J3: { t:'wires', pads:[[66.5,15],[66.5,17.8],[66.5,20.6],[66.5,23.4]], dir:'right', colors:['#2c62d6','#d42a2a','#24974a','#222'] },
};

/* named probe points */
const PT = {
  'J1+':[58.5,26.8,'J1 + pad'], 'J1-':[62,26.8,'J1 − pad'],
  'F1sq':[34.04,26.8,'F1 right leg (square pad)'],
  'J2-1':[66.5,6.4,'J2-1 pad (+5V, square)'], 'J2-2':[66.5,9.2,'J2-2 pad (GND)'], 'J2-3':[66.5,12,'J2-3 pad (DATA)'],
  'J3-1':[66.5,15,'J3-1 pad (M+, square)'], 'J3-2':[66.5,17.8,'J3-2 pad (M−)'], 'J3-3':[66.5,20.6,'J3-3 pad (TRIG)'], 'J3-4':[66.5,23.4,'J3-4 pad (GND)'],
  'U3.1':[...u3pin(1),'XIAO pin 1, GPIO2 (square pad, bottom-left)'], 'U3.3':[...u3pin(3),'XIAO pin 3, GPIO4 (bottom row, 3rd)'],
  'U3.12':[...u3pin(12),'XIAO 3V3 pin (top row, 3rd)'], 'U3.14':[...u3pin(14),'XIAO 5V pin (top-left)'],
  'Q1G':[48.2,18.6,'Q1 G (left leg)'],
  'modOUT':[10,33.4,'MT3608 VOUT+ terminal (module end of the OUT+ wire)'],
  'modIN':[17,33.4,'MT3608 VIN+ terminal (module end of the IN+ wire)'],
  'J2p1':[73.6,6.4,'J2 plug, pin 1 contact'], 'J2p2':[73.6,9.2,'J2 plug, pin 2 contact'],
  'J3p1':[73.6,15,'J3 plug, pin 1 contact'], 'J3p4':[73.6,23.4,'J3 plug, pin 4 contact'],
};
for (let n = 1; n <= 14; n++) PT['U2.'+n] = [...u2pin(n), 'U2 pin '+n];

/* ---------- steps ---------- */
const STAGES = [
  ['prep','Prep'], ['res','Resistors'], ['small','Caps + diode'], ['pwr','Fuse + MOSFET'],
  ['wires','Cell · switch · boost'], ['trim','First power + trim'], ['logic','Chip + big cap'],
  ['xiao','XIAO'], ['leads','Arm leads'], ['finish','Finish'],
];
const HOW_RES = true;

function el(tag, at, parent) { const e = document.createElementNS(NS, tag); for (const k in at) e.setAttribute(k, at[k]); (parent || svg).appendChild(e); return e; }
function txt(s, x, y, at = {}, parent) { const t = el('text', Object.assign({ x, y, 'font-family':'IBM Plex Mono, monospace', 'font-size':1.25, fill:'var(--silk)', 'text-anchor':'middle', 'dominant-baseline':'central' }, at), parent); t.textContent = s; return t; }

function bbox(ref) {
  const p = PARTS[ref];
  if (p.box) return p.box;
  if (p.t === 'res' || p.t === 'disc') { const [a, b] = [p.a, p.b]; return [Math.min(a[0],b[0])-1.3, Math.min(a[1],b[1])-1.4, Math.max(a[0],b[0])+1.3, Math.max(a[1],b[1])+1.4]; }
  if (p.t === 'diode') return [p.k[0]-1.3, 1.2, p.a[0]+1.3, 4];
  if (p.t === 'ecap') return [p.c[0]-p.r, p.c[1]-p.r, p.c[0]+p.r, p.c[1]+p.r];
  if (p.t === 'wires') { const xs = p.pads.map(q => q[0]), ys = p.pads.map(q => q[1]); return [Math.min(...xs)-1.4, Math.min(...ys)-1.4, Math.max(...xs)+1.4, Math.max(...ys)+1.4]; }
}

function axial(p, g, bodyLen, bodyW, fill, rx) {
  const [ax, ay] = p.a || p.k, [bx, by] = p.b || p.a2 || p.a;
  const cx = (ax + bx)/2, cy = (ay + by)/2, ang = Math.atan2(by - ay, bx - ax) * 180/Math.PI;
  el('line', { x1:ax, y1:ay, x2:bx, y2:by, stroke:'#c9ced3', 'stroke-width':.6 }, g);
  const gg = el('g', { transform:`translate(${cx} ${cy}) rotate(${ang})` }, g);
  el('rect', { x:-bodyLen/2, y:-bodyW/2, width:bodyLen, height:bodyW, rx, fill, stroke:'#00000055', 'stroke-width':.1 }, gg);
  return gg;
}

function drawPart(ref, mode) {
  const p = PARTS[ref], g = el('g', { opacity: mode === 'todo' ? 1 : 1 });
  const silk = { fill:'none', stroke:'var(--silk)', 'stroke-width':.15 };

    else if (p.t === 'disc') { const gg = axial(p, g, 6.8, 2.5, 'none', .3); g.firstChild.remove(); gg.firstChild.setAttribute('stroke','var(--silk)'); gg.firstChild.setAttribute('stroke-width', .15); }
    else if (p.t === 'diode') { el('rect', Object.assign({ x:8.6, y:1.3, width:6, height:2.6 }, silk), g); el('line', { x1:9.4, y1:1.3, x2:9.4, y2:3.9, stroke:'var(--silk)', 'stroke-width':.35 }, g); }
    else if (p.t === 'ecap') { el('circle', Object.assign({ cx:p.c[0], cy:p.c[1], r:p.r }, silk), g); el('path', { d:`M${p.c[0]+1.4} ${p.c[1]-4.8} A5 5 0 0 1 ${p.c[0]+1.4} ${p.c[1]+4.8} Z`, fill:'var(--silk)', opacity:.9 }, g); txt('+', 44.4, 6.4, { 'font-size':2 }, g); }
    else if (p.t === 'dip') { const [x1,y1,x2,y2] = p.box; el('path', Object.assign({ d:`M${x1} ${y1} H${x2} V${y2} H${x1} V${(y1+y2)/2+1} A1 1 0 0 0 ${x1} ${(y1+y2)/2-1} Z` }, silk), g); }
    else if (p.t === 'to220') { const [x1,y1,x2,y2] = p.box; el('rect', Object.assign({ x:x1, y:y1, width:x2-x1, height:y2-y1 }, silk), g); el('line', { x1, y1:y1+1.2, x2, y2:y1+1.2, stroke:'var(--silk)', 'stroke-width':.15 }, g); 'GDS'.split('').forEach((c,i) => txt(c, 48.2+i*2.54, 20.95, { 'font-size':.95 }, g)); }
    else if (p.t === 'fuse') { const [x1,y1,x2,y2] = p.box; el('rect', Object.assign({ x:x1, y:y1, width:x2-x1, height:y2-y1 }, silk), g); }

  else if (p.t === 'diode') {
    el('line', { x1:p.k[0], y1:2.6, x2:p.a[0], y2:2.6, stroke:'#c9ced3', 'stroke-width':.6 }, g);

  } else if (p.t === 'ecap') {

    el('circle', { cx:p.c[0], cy:p.c[1], r:p.r, fill:'#24305e' }, g);

    txt('−', p.c[0]+2.9, p.c[1], { fill:'#24305e', 'font-size':2.4 }, g);

  } else if (p.t === 'to220') {
    const [x1,y1,x2,y2] = p.box;
    el('rect', { x:x1, y:y1, width:x2-x1, height:1.3, fill:'#c9ced3' }, g);
    el('rect', { x:x1+.2, y:y1+1.3, width:x2-x1-.4, height:y2-y1-1.3, fill:'#1d1d1f' }, g);
    txt('RFP30N06LE', (x1+x2)/2, y1+3.1, { fill:'#999', 'font-size':.95 }, g);
  } else if (p.t === 'fuse') {

    txt('GBX185', 31.5, 26.8, { fill:'#5b4300', 'font-size':1.2 }, g);
  } else if (p.t === 'xiao') {
    el('rect', { x:-0.4, y:5.1, width:21, height:17.8, rx:1, fill:'#1f2a44' }, g);
    el('rect', { x:6.5, y:8.6, width:11.5, height:10.8, rx:.4, fill:'#c4c9cf' }, g);

  return g;
}

// every through-hole pad, tagged with the part it belongs to
function padList() {
  const out = [], P = (ref, x, y, sq, size, drill) => out.push({ ref, x, y, sq, size, drill });
  for (let n = 1; n <= 14; n++) { const [x, y] = u2pin(n); P('U2', x, y, n === 1, 1.6, .8); }
  for (let n = 1; n <= 14; n++) { const [x, y] = u3pin(n); P('U3', x, y, n === 1, 1.7, 1); }
  ['R1','R2','R3','R4','R5','R6','C2','C3'].forEach(r => { P(r, ...PARTS[r].a, false, 1.6, .8); P(r, ...PARTS[r].b, false, 1.6, .8); });
  P('CR2', 6.5, 2.6, true, 2.2, 1.1); P('CR2', 16.66, 2.6, false, 2.2, 1.1);
  P('C1', 46.5, 9, true, 2, 1); P('C1', 51.5, 9, false, 2, 1);
  [48.2, 50.74, 53.28].forEach((x, i) => P('Q1', x, 18.6, i === 0, 1.9, 1.1));
  P('F1', 34.04, 26.8, true, 2, 1); P('F1', 28.96, 26.8, false, 2, 1);
  ['U1','SW1','J1','J2','J3'].forEach(r => PARTS[r].pads.forEach((q, i) => P(r, q[0], q[1], i === 0, 2.2, 1.1)));
  return out;
}

/* back of the board, flipped like a page (left <-> right), as you see it after turning it over */
function drawBack() {
  const wrap = document.getElementById('backWrap'), bs = document.getElementById('boardBack');
  const cur = A().cur, step = S[cur], c = (step.checks || [])[sel];
  wrap.hidden = !(step.fits || (c && c.spots));
  if (wrap.hidden) return;
  bs.innerHTML = '';
  const fitted = new Set(), now = new Set(step.fits || []);
  S.slice(0, cur).forEach(s => (s.fits || []).forEach(r => fitted.add(r)));
  const g = el('g', { transform:'translate(70 0) scale(-1 1)' }, bs);
  el('rect', { x:0, y:0, width:70, height:30, rx:1, fill:'var(--mask)', stroke:'var(--mask-edge)', 'stroke-width':.3 }, g);
  [[2.5,2.5],[67.5,2.5],[2.5,27.5],[67.5,27.5]].forEach(([x,y]) => el('circle', { cx:x, cy:y, r:1.1, fill:'var(--bg)', stroke:'#0003', 'stroke-width':.2 }, g));
  padList().forEach(p => {
    const shape = p.sq ? ['rect', { x:p.x-p.size/2, y:p.y-p.size/2, width:p.size, height:p.size }] : ['circle', { cx:p.x, cy:p.y, r:p.size/2 }];
    el(shape[0], Object.assign({ fill:'var(--pad)' }, shape[1]), g);
    if (fitted.has(p.ref)) {
      // finished joint: a shiny cone with the snipped lead in the middle
      el('circle', { cx:p.x, cy:p.y, r:p.size/2 - .1, fill:'#e9ecee', stroke:'#9aa1a7', 'stroke-width':.12 }, g);
      el('circle', { cx:p.x, cy:p.y, r:.28, fill:'#8d949a' }, g);
    } else if (now.has(p.ref)) {
      // lead poking through, waiting for solder
      el('circle', { cx:p.x, cy:p.y, r:p.drill/2, fill:'var(--hole)' }, g);
      el('circle', { cx:p.x, cy:p.y, r:p.drill/2 - .12, fill:'#b8bec4' }, g);
      el('circle', { cx:p.x, cy:p.y, r:p.size/2 + .45, class:'halo' }, g);
      // splayed legs bend outward, away from the part's middle
      if (legKind(step) === 'splay') {
        const own = padList().filter(q => q.ref === p.ref), mx = own.reduce((a, q) => a + q.x, 0) / own.length, my = own.reduce((a, q) => a + q.y, 0) / own.length;
        const dx = p.x - mx, dy = p.y - my, n = Math.hypot(dx, dy) || 1;
        el('line', { x1:p.x, y1:p.y, x2:p.x + dx/n*2.2, y2:p.y + dy/n*2.2, stroke:'#b8bec4', 'stroke-width':.5, 'stroke-linecap':'round' }, g);
      }
    } else el('circle', { cx:p.x, cy:p.y, r:p.drill/2, fill:'var(--hole)' }, g);
  });
  if (c && c.spots) c.spots.forEach(k => SPOTS[k].forEach(([x, y, w, h]) => el('rect', { x:x-w/2-.4, y:y-h/2-.4, width:w+.8, height:h+.8, rx:.8, fill:'none', stroke:'var(--accent-fill)', 'stroke-width':.45, 'stroke-dasharray':'.8 .5', class:'probe-ring' }, g)));
  // back silk reads normally once flipped; mirror its x by hand
  txt('CLOWN POD rev A', 70 - 34.62, 13.9, { 'font-size':1.2, 'font-weight':700 }, bs);
  txt('XIAO end →', 70 - 10, 14, { 'font-size':1, opacity:.55 }, bs);
}

function drawBoard() {
  svg.innerHTML = '';

  // board
  el('rect', { x:0, y:0, width:70, height:30, rx:1, fill:'var(--mask)', stroke:'var(--mask-edge)', 'stroke-width':.3 });
  [[2.5,2.5],[67.5,2.5],[2.5,27.5],[67.5,27.5]].forEach(([x,y]) => el('circle', { cx:x, cy:y, r:1.1, fill:'var(--bg)', stroke:'#0003', 'stroke-width':.2 }));

    ['5V','GND','3V3','GPIO10','GPIO9','GPIO8','GPIO20'].forEach((s, i) => L(s, 2.5+i*2.54, 7.9, { 'font-size':.75, transform:`rotate(-90 ${2.5+i*2.54} 7.9)`, 'text-anchor':'end' }));

function probe(who, col, sign) {
  const list = (Array.isArray(who) ? who : [who]).filter(k => PT[k]);
  list.forEach((k, i) => {
    const [x, y] = PT[k];
    el('circle', { cx:x, cy:y, r:1.55, fill:'none', stroke:'#fff', 'stroke-width':.75 });
    el('circle', { cx:x, cy:y, r:1.55, fill:'none', stroke:col, 'stroke-width':.5, class:'probe-ring' });
    if (i === 0) {
      const ty = y < 4 ? y + 3.1 : y - 3.1;
      el('circle', { cx:x, cy:ty, r:1.15, fill:col, stroke:'#fff', 'stroke-width':.2 });
      txt(sign, x, ty, { fill:'#fff', 'font-size':1.7, 'font-weight':700 });
    }
  });
}
const ptName = k => PT[k] ? PT[k][2] : k;

function sideSVG(kind) {

function sideHTML(st) {

// What the legs do on the back, per kind of part: in, soldered, trimmed.
function legKind(s) {
  if (s.title === 'U2') return 'dip';
  if (s.title === 'Q1') return 'upright';
  if (s.st === 'xiao') return 'header';
  if (s.st === 'wires' || s.st === 'leads') return 'wire';
  return 'splay';
}
const LEG_CAPS = {
  splay:   ['Push through. Bend each leg out ~30°. Not flat', 'Solder: shiny cone, leg still long', 'Snip just above the cone'],
  upright: ['Straight through. Don’t bend. Tape it upright', 'Solder: shiny cone', 'Snip just above the cone'],
  dip:     ['Straight through. Don’t bend', 'Solder: shiny cone', 'Leave it. Legs are already short'],
  header:  ['Long ends down through the board', 'Solder top and back', 'Snip the long ends flush'],
  wire:    ['Tinned end through, ~1 mm out the back', 'Solder: shiny cone', 'Nothing to snip. Check for stray strands'],
};
function legSVG(kind, stage) {
  const xs = kind === 'wire' ? [32] : kind === 'header' ? [24, 40] : kind === 'upright' ? [24, 32, 40] : [22, 42];
  const leg = 'fill="none" stroke="#9aa1a7" stroke-width="1.6" stroke-linecap="round"';
  let body = '';
  if (kind === 'wire') body = '<path d="M10 2 C22 2 32 6 32 16" fill="none" stroke="var(--accent-fill)" stroke-width="3.2" stroke-linecap="round"/>';
  else if (kind === 'header') body = '<rect x="14" y="2" width="36" height="4" rx="1" fill="#1f2a44"/><rect x="18" y="8" width="28" height="8" fill="#222"/>';
  else if (kind === 'dip') body = '<rect x="16" y="6" width="32" height="8" rx="1" fill="#1d1d1f"/>';
  else if (kind === 'upright') body = '<rect x="20" y="0" width="24" height="10" fill="#1d1d1f"/><rect x="20" y="0" width="24" height="2" fill="#c9ced3"/>';
  else body = '<rect x="18" y="6" width="28" height="8" rx="3.5" fill="#d9c08f"/>';
  const top = kind === 'header' ? 4 : kind === 'wire' ? 16 : kind === 'upright' ? 10 : 14;
  const legs = xs.map((x, i) => {
    const d = xs.length === 1 ? 0 : (i === 0 ? -1 : i === xs.length - 1 ? 1 : 0);
    if (kind === 'wire') return `<path d="M${x} ${top} V23" ${leg}/>`;
    if (kind === 'header') return `<path d="M${x} ${top} V${stage === 2 ? 23.5 : 36}" ${leg}/>`;
    if (kind === 'dip') return `<path d="M${x} ${top} V25" ${leg}/>`;
    if (stage === 2) return `<path d="M${x} ${top} V25.5" ${leg}/>`;
    if (kind === 'upright') return `<path d="M${x} ${top} V36" ${leg}/>`;
    return `<path d="M${x} ${top} V23 L${x + d*8} 35" ${leg}/>`;
  }).join('');
  const cones = stage > 0 ? xs.map(x => `<path d="M${x-3.4} 21 L${x} 25 L${x+3.4} 21 Z" fill="#e3e6e9" stroke="#9aa1a7" stroke-width=".3"/>`).join('') : '';
  const cutter = stage === 2 && ['splay','upright','header'].includes(kind)
    ? `<path d="M4 33 L10 27 M4 27 L10 33" stroke="var(--bad)" stroke-width="1" stroke-linecap="round"/><line x1="6" y1="${kind === 'header' ? 23.5 : 25.5}" x2="58" y2="${kind === 'header' ? 23.5 : 25.5}" stroke="var(--bad)" stroke-width=".4" stroke-dasharray="1.2 .8"/>` : '';
  return `<svg viewBox="0 0 64 40" aria-hidden="true">${body}<rect x="2" y="16" width="60" height="5" fill="var(--mask)"/>${legs}${cones}${cutter}
    <text x="62" y="14" font-size="3.4" text-anchor="end" fill="currentColor">front</text><text x="62" y="28" font-size="3.4" text-anchor="end" fill="var(--ok)">back</text></svg>`;
}
function legsHTML(s) {
  const k = legKind(s);
  return `<div class="legs">${[0,1,2].map(i => `<figure>${legSVG(k, i)}<figcaption><b>${i+1}</b> ${LEG_CAPS[k][i]}</figcaption></figure>`).join('')}</div>`;
}

// First power reads low at J3? Walk back along the cell path: cell → J1 → SW1 → F1 → J3-1.
// Each panel is a to-scale crop of the board's bottom-right, front side.
function traceCrop(red, black, vb = [24, 12.5, 48, 19.5]) {
  const [x0, y0, w, h] = vb, bx = Math.max(x0, 0), by = Math.max(y0, 0);
  const inView = p => p.x > x0 && p.x < x0 + w && p.y > y0 && p.y < y0 + h;
  const pads = padList().filter(inView).map(p => (p.sq
    ? `<rect x="${p.x-p.size/2}" y="${p.y-p.size/2}" width="${p.size}" height="${p.size}" fill="var(--pad)"/>`
    : `<circle cx="${p.x}" cy="${p.y}" r="${p.size/2}" fill="var(--pad)"/>`) + `<circle cx="${p.x}" cy="${p.y}" r="${p.drill/2}" fill="var(--hole)"/>`).join('');
  const T = (s, x, y, a = 'middle', fs = 1) => `<text x="${x}" y="${y}" font-size="${fs}" text-anchor="${a}" dominant-baseline="central" fill="var(--silk)" font-family="IBM Plex Mono, monospace">${s}</text>`;
  const silk = T('J1 CELL', 60.25, 24.95) + T('+', 58.5, 28.85) + T('−', 62, 28.85) + T('SW1', 47.75, 24.95) + T('B', 46, 28.85) + T('A', 49.5, 28.85)
    + T('F1', 31.5, 29.3, 'middle', 1.1) + ['J3-1 M+','J3-2 M−','J3-3 TRIG','J3-4 GND'].map((s, i) => T(s, 64.6, [15,17.8,20.6,23.4][i], 'end')).join('')
    + ['J2-1 +5V','J2-2 GND','J2-3 DATA'].map((s, i) => T(s, 64.6, [6.4,9.2,12][i], 'end')).join('');
  const fuse = '<rect x="24.4" y="25.2" width="14.2" height="3.2" rx="1.6" fill="#e7b81f" opacity=".55"/>';
  const wires = [[58.5,'#d42a2a'],[62,'#222'],[46,'#d42a2a'],[49.5,'#d42a2a']].map(([x, c]) => `<line x1="${x}" y1="26.8" x2="${x}" y2="32" stroke="${c}" stroke-width=".9"/>`).join('');
  const probe = (k, col, sign) => {
    const [x, y] = PT[k], right = x > 65;
    const [tx, ty] = right ? [x + 3.3, y] : [x, y - 3.1];
    return `<circle cx="${x}" cy="${y}" r="1.55" fill="none" stroke="#fff" stroke-width=".75"/><circle cx="${x}" cy="${y}" r="1.55" fill="none" stroke="${col}" stroke-width=".5" class="probe-ring"/>
      <circle cx="${tx}" cy="${ty}" r="1.2" fill="${col}" stroke="#fff" stroke-width=".2"/><text x="${tx}" y="${ty}" font-size="1.7" font-weight="700" text-anchor="middle" dominant-baseline="central" fill="#fff">${sign}</text>`;
  };
  return `<svg viewBox="${x0} ${y0} ${w} ${h}" aria-hidden="true"><rect x="${bx}" y="${by}" width="${70-bx}" height="${30-by}" rx="1" fill="var(--mask)"/>${fuse}${wires}${pads}${silk}${probe(black,'var(--probe-black)','−')}${probe(red,'var(--probe-red)','+')}</svg>`;
}
function traceHTML() {
  const T = [
    ['J3-1', 'J3-4', 'Where you are now', '3.0 – 4.2 V', 'Low (e.g. 209 mV) → work back through 1, 2, 3 below.'],
    ['J1+', 'J1-', '1 · Is the cell reaching the board?', '3.0 – 4.2 V', 'Low here → unplug, meter the <b>cell’s own plug pins</b>. Near 0 there too → protection tripped: kit charger 5–10 min, measure again. Fine at the cell → reheat the J1 joints.'],
    ['J1+', 'F1sq', '2 · Is the switch closing?', 'about 0 V, rocker ON', 'Shows the cell voltage → rocker is OFF, or SW1’s wires / joints are bad.'],
    ['J3-1', 'J3-4', '3 · Back at J3, after 1 and 2 pass', '3.0 – 4.2 V', 'Still low → F1 joint. Reheat both F1 legs.'],
  ];
  const rows = T.map(([r, b, title, exp, fix]) => `<figure class="tr">
      ${traceCrop(r, b)}
      <figcaption><b>${title}</b>
        <span class="pr"><span class="tag red">RED +</span>${ptName(r)}</span>
        <span class="pr"><span class="tag blk">BLACK −</span>${ptName(b)}</span>
        <span>DC V · expect <strong>${exp}</strong></span>
        <span class="fixline">${fix}</span></figcaption></figure>`).join('');
  return `<details class="trace" open><summary>J3 reads low? Trace it back to the cell</summary>
    <p class="trflow">Power path: <b>cell</b> → <b>J1</b> → <b>SW1</b> rocker → <b>F1</b> → <b>J3-1</b>. Find where the voltage stops.</p>${rows}</details>`;
}

    <rect x="194" y="74" width="12" height="22" rx="2" fill="#1b1b1b"/><rect x="194" y="74" width="12" height="5" fill="#cfd3d6"/>
    ${T(212, 80, 'CR1 · 1N5819', 'start', 'font-weight="700"')}${T(212, 91, 'band → red side')}
    ${tape(200, 60)}${tape(200, 110)}
    <rect x="270" y="176" width="40" height="44" rx="3" fill="#1b1b1b"/><path d="M310 182 L326 214" stroke="#9aa1a7" stroke-width="2" fill="none"/>
    ${T(290, 234, 'trigger switch', 'middle', 'font-weight="700"')}${T(290, 245, 'either way round', 'middle')}
    ${W('M270 188 Q236 188 228 170 H200', '#d42a2a')}${W('M270 208 Q236 208 228 210 H200', '#d42a2a')}
    ${tape(200, 170)}${tape(200, 210)}
    ${T(10, 256, 'Grey = tape. Wrap each join on its own; no two may touch.')}
  </svg>`;
  return `<details class="trace" open><summary>Bench test: wire the blower and trigger</summary>${svg}
    <ol class="u1steps">
      <li>Motor <b>red → blue</b>, motor <b>black → red</b>. The colours cross: red is motor minus on this lead</li>
      <li><b>CR1</b> across the two motor joins, <b>band on the motor-red / blue join</b>. Backwards = short across the cell</li>
      <li>Switch wires → <b>green</b> and <b>black</b>, either way. Beep it first: silent at rest, beeps pressed</li>
      <li>Tape every join separately. Plug into J3, strip into J2, cell in, rocker ON</li>
    </ol></details>`;
}

function renderCard() {
  const a = A(), i = a.cur, s = S[i];
  if (sel >= (s.checks || []).length) sel = 0;
  const stageName = STAGES.find(x => x[0] === s.st)[1];
  const allOk = (s.checks || []).every((c, k) => a.checks[s.id + '#' + k] === 'ok');
  const isFit = !!s.fits;
  let h = `<div class="eyebrow"><span>${stageName}</span><span>·</span><span>Step ${i+1} of ${S.length}</span>${a.done[s.id] ? '<span class="done-flag">✓ done</span>' : ''}</div>`;
  h += `<h2>${s.title}${s.val ? ` <span class="val">${s.val}</span>` : ''}</h2>`;
  const chips = [];
  if (s.sub) chips.push(`<span class="chip">${s.sub}</span>`);
  if (s.bands) chips.push(bandsHTML(s.bands));
  if (isFit) chips.push(`<span class="chip now">Solder: now. One lead per hole</span>`);
  if (chips.length) h += `<div class="chips">${chips.join('')}</div>`;
  if (isFit) h += sideHTML(s.st) + legsHTML(s);
  if (s.needs === 'trimmed' && !a.done[S[TRIM_STEP].id]) h += `<div class="warn">“Trim the boost” isn’t ticked for Arm ${state.arm}. Trim U1 to 5.00 V before this part goes on.</div>`;
  if (s.orient) h += `<div class="orient">${s.orient}</div>`;
  if (s.diagram === 'u1') h += u1HTML();
  if (s.diagram === 'bench') h += benchHTML();
  if (s.diagram === 'trim') h += trimHTML();
  if (s.do) h += `<ul class="do">${s.do.map(d => `<li>${d}</li>`).join('')}</ul>`;
  if (s.extra === 'parts') h += `<div class="tblwrap"><table class="parts">${PARTS_LIST.map(r => `<tr><td>${r[0]}</td><td>${r[1]}</td><td style="color:var(--muted)">${r[2]}</td></tr>`).join('')}</table></div>`;
  if (s.checks) {
    h += `<div class="checks"><h3>Checks <small>Tap one to see the probes on the board</small></h3>`;
    s.checks.forEach((c, k) => {
      const st = a.checks[s.id + '#' + k] || '';
      const meter = !['look','touch','do'].includes(c.m);
      let pr = '';
      if (meter) pr = `<div class="pr"><span class="tag red">RED</span><span>${Array.isArray(c.r) ? c.r.map(ptName).join(', ') : ptName(c.r)}</span></div><div class="pr"><span class="tag blk">BLACK</span><span>${ptName(c.b)}</span></div>`;
      h += `<div class="check ${st} ${k === sel ? 'sel' : ''}" data-k="${k}" tabindex="0">
        <div class="chk-top"><span class="mode">${MODE[c.m]}</span><div class="probes">${pr}<div class="expect">${meter ? 'Expect ' : ''}<strong${meter ? '' : ' style="font-family:var(--f-body)"'}>${c.e}</strong>${c.bands ? ' ' + bandsHTML(c.bands) : ''}</div>${c.w ? `<div class="why">${c.w}</div>` : ''}</div></div>
        ${st === 'bad' && c.x ? `<div class="fix">${c.x}</div>` : ''}
        ${st === 'bad' && !c.x ? `<div class="fix">Stop here. Recheck the last part’s joints and orientation, then measure again.</div>` : ''}
        <div class="cbtns"><button type="button" class="y" data-v="ok" aria-pressed="${st === 'ok'}">${meter ? 'Reads right' : 'Done'}</button><button type="button" class="n" data-v="bad" aria-pressed="${st === 'bad'}">${meter ? 'Doesn’t' : 'Problem'}</button></div>
      </div>`;
    });
    h += `</div>`;
  }
  if (s.diagram === 'trace') h += traceHTML();
  if (s.how) h += `<details class="how"><summary>How: a through-hole joint</summary><ol>
    <li>Bend the legs to the hole spacing. Push through from the <b>front</b> (white outlines)</li>
    <li>On the <b>back</b>, bend each leg outward ~30° so it stays put. Not flat against the board</li>
    <li>Flip so the <b>back</b> (“CLOWN POD rev A”) faces you. Iron touches pad and leg together, ~1 s</li>
    <li>Feed solder into the joint, not onto the iron. 2–3 s total</li>
    <li>Shiny cone, pad fully covered. Snip the leg just above the joint</li></ol></details>`;
  const left = (s.checks || []).filter((c, k) => a.checks[s.id + '#' + k] !== 'ok').length;
  const label = i === S.length - 1 ? (a.done[s.id] ? 'Board finished' : 'Mark board finished') : (s.checks ? 'All checks pass, next' : isFit ? 'Soldered, next' : 'Done, next');
  h += `<div class="nav"><button type="button" class="back" id="back" ${i === 0 ? 'disabled' : ''}>Back</button><button type="button" class="next" id="next" ${allOk ? '' : 'disabled'}>${label} →</button></div>`;
  if (!allOk) h += `<div class="gate">${left} check${left > 1 ? 's' : ''} left to tick</div>`;
  if (i < S.length - 1) { const n = S[i+1]; h += `<div class="upnext">Up next: <b>${n.title}${n.val ? ' · ' + n.val : ''}</b></div>`; }
  card.innerHTML = h;

  card.querySelectorAll('.check').forEach(box => {
    const k = +box.dataset.k;
    box.addEventListener('click', e => {
      const b = e.target.closest('button[data-v]');
      if (b) { const key = s.id + '#' + k; a.checks[key] = a.checks[key] === b.dataset.v ? undefined : b.dataset.v; if (!a.checks[key]) delete a.checks[key];
        if (b.dataset.v === 'ok') { const nx = s.checks.findIndex((c, j) => j > k && a.checks[s.id + '#' + j] !== 'ok'); sel = nx >= 0 ? nx : k; } else sel = k;
        save(); render(); return; }
      sel = k; render();
    });
    box.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target === box) { sel = k; render(); } });
  });
  document.getElementById('back').onclick = () => go(i - 1);
  document.getElementById('next').onclick = () => { a.done[s.id] = true; save(); if (i < S.length - 1) go(i + 1); else render(); };
}

function renderCaption() {
  const s = S[A().cur], c = (s.checks || [])[sel], cap = document.getElementById('caption');
  if (c && !['look','touch','do'].includes(c.m)) {
    cap.innerHTML = `<div class="pr"><span class="tag red">RED +</span><span>${Array.isArray(c.r) ? c.r.map(ptName).join(', ') : ptName(c.r)}</span></div><div class="pr"><span class="tag blk">BLACK −</span><span>${ptName(c.b)}</span></div>`;
  } else if (c && c.spots) cap.innerHTML = `<div class="pr"><span class="tag look">LOOK</span><span>Dashed boxes: check these spots on the back</span></div>`;
  else if (s.fits) cap.innerHTML = `<div class="pr"><span class="tag look">FIT</span><span>${s.fits.join(', ')}: glowing outline</span></div>`;
  else cap.innerHTML = '';
}

const POWER = {
  out:['out','Cell unplugged · safe to solder'],
  on:['on','Cell IN, rocker ON · don’t solder · meter only'],
  usb:['usb','USB only · cell out, rocker OFF'],
  brief:['brief','Cell on the loose lead only · unplug before soldering'],
};
function renderBar() {
  const a = A(), i = a.cur;
  document.getElementById('count').innerHTML = `Step <b>${i+1}</b>/${S.length} · ${Object.keys(a.done).length} done`;
  ['1','2'].forEach(n => document.getElementById('arm' + n).setAttribute('aria-pressed', state.arm === n));
  const pw = POWER[S[i].pw]; const pb = document.getElementById('power'); pb.className = 'power ' + pw[0]; document.getElementById('powerText').textContent = pw[1];
  const box = document.getElementById('stages'); box.innerHTML = '';
  STAGES.forEach(([id, name]) => {
    const steps = S.filter(s => s.st === id), d = steps.filter(s => a.done[s.id]).length;
    const b = document.createElement('button'); b.type = 'button'; b.style.setProperty('--n', steps.length);
    if (S[i].st === id) b.className = 'cur';
    b.title = `${name}: ${d}/${steps.length}`; b.setAttribute('aria-label', b.title);
    b.innerHTML = `<i><b style="width:${100*d/steps.length}%"></b></i><span>${name}</span>`;
    b.onclick = () => { const f = steps.find(s => !a.done[s.id]) || steps[0]; go(f.i); };
    box.appendChild(b);
  });
}
function renderList() {
  const a = A(), box = document.getElementById('slist');
  box.innerHTML = STAGES.map(([id, name]) => `<div><h4>${name}</h4><ol>${S.filter(s => s.st === id).map(s =>
    `<li><button type="button" data-i="${s.i}" class="${s.i === a.cur ? 'cur' : ''}"><span class="n">${s.i+1}</span><span class="tick">${a.done[s.id] ? '✓' : ''}</span><span>${s.title}${s.val ? ' · ' + s.val : ''}</span></button></li>`).join('')}</ol></div>`).join('');
  box.querySelectorAll('button').forEach(b => b.onclick = () => { go(+b.dataset.i); window.scrollTo({ top:0 }); });
  const rb = document.getElementById('resetBox');
  rb.innerHTML = `<button type="button" id="rs">Start Arm ${state.arm} over</button>`;
  document.getElementById('rs').onclick = () => {
    rb.innerHTML = `<span>Clear every tick for Arm ${state.arm}?</span><button type="button" class="danger" id="rsy">Yes, clear</button><button type="button" id="rsn">Keep</button>`;
    document.getElementById('rsy').onclick = () => { state.arms[state.arm] = { cur:0, done:{}, checks:{} }; sel = 0; save(); render(); };
    document.getElementById('rsn').onclick = renderList;
  };
}
function go(i) {
  if (i < 0 || i >= S.length) return;
  A().cur = i; const s = S[i], a = A();
  const firstOpen = (s.checks || []).findIndex((c, k) => a.checks[s.id + '#' + k] !== 'ok');
  sel = firstOpen >= 0 ? firstOpen : 0;
  save(); render();
}
function render() { renderBar(); renderCard(); drawBoard(); drawBack(); renderCaption(); renderList(); }

document.querySelectorAll('[data-arm]').forEach(b => b.onclick = () => { state.arm = b.dataset.arm; sel = 0; save(); go(A().cur); });
document.addEventListener('keydown', e => {
  if (e.target.closest('input, textarea')) return;
  if (e.key === 'ArrowLeft') go(A().cur - 1);
  if (e.key === 'ArrowRight') go(A().cur + 1);
});

/* keep the screen awake at the bench */
let lock = null;
const awake = document.getElementById('awake');
async function wantLock() { try { lock = await navigator.wakeLock.request('screen'); } catch (e) { awake.checked = false; } }
awake.addEventListener('change', () => { if (awake.checked) wantLock(); else if (lock) { lock.release(); lock = null; } });
document.addEventListener('visibilitychange', () => { if (awake.checked && document.visibilityState === 'visible') wantLock(); });

go(A().cur);
</script>
